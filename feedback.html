<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Ascension — Your Feedback</title>
<meta name="theme-color" content="#060606">
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,200;0,300;0,400;0,500;1,300&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --black:#060606; --ink:#0d0d0d; --white:#f4f1ec;
  --white-dim:rgba(244,241,236,.72); --white-faint:rgba(244,241,236,.42);
  --hairline:rgba(244,241,236,.16); --hairline-strong:rgba(244,241,236,.34);
  --sans:"Jost","Futura",system-ui,sans-serif; --serif:"Cormorant Garamond",Georgia,serif;
  --ease:cubic-bezier(.16,1,.3,1);
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--black);color:var(--white);font-family:var(--sans);font-weight:300;min-height:100svh;-webkit-font-smoothing:antialiased;overflow-x:hidden}
::selection{background:var(--white);color:var(--black)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.atmos{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.glow{position:absolute;width:90vmax;height:90vmax;border-radius:50%;filter:blur(60px);opacity:.5;top:-35vmax;left:-20vmax;background:radial-gradient(circle at center,rgba(244,241,236,.05) 0%,transparent 62%);animation:drift 30s ease-in-out infinite alternate}
@keyframes drift{from{transform:translate3d(0,0,0) scale(1)}to{transform:translate3d(8vmax,7vmax,0) scale(1.12)}}
.vignette{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 52%,rgba(0,0,0,.5) 100%)}
main{position:relative;z-index:1;min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:8vh 22px}
.wordmark{width:clamp(140px,40vw,196px);height:auto;margin-bottom:6vh;opacity:0;animation:rise 1.2s var(--ease) .1s forwards}
.stage{width:min(560px,100%);opacity:0;animation:rise 1.1s var(--ease) .35s forwards}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.fade{opacity:1;animation:fade .7s var(--ease) forwards}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.eyebrow{font-size:10px;letter-spacing:.5em;text-indent:.5em;text-transform:uppercase;color:var(--white-faint);margin-bottom:3vh}
h1{font-weight:200;font-size:clamp(23px,5.2vw,32px);letter-spacing:.2em;text-indent:.2em;text-transform:uppercase;margin-bottom:2.2vh}
.lede{font-family:var(--serif);font-style:italic;font-size:clamp(16px,4.4vw,19px);line-height:1.7;color:var(--white-dim);margin-bottom:5vh}
.q{text-align:left;max-width:480px;margin:0 auto 30px}
.q .qt{font-size:14px;letter-spacing:.03em;color:var(--white);margin-bottom:14px;line-height:1.5}
.opt{display:flex;align-items:center;gap:12px;border:1px solid var(--hairline);padding:13px 16px;margin-bottom:9px;cursor:pointer;transition:border-color .25s,background .25s}
.opt:hover{border-color:var(--hairline-strong)}
.opt.sel{border-color:var(--white);background:rgba(244,241,236,.05)}
.opt .box{flex:0 0 16px;height:16px;border:1px solid var(--white-faint);border-radius:50%;position:relative;transition:border-color .25s}
.opt.multi .box{border-radius:3px}
.opt.sel .box{border-color:var(--white)}
.opt.sel .box::after{content:"";position:absolute;inset:3px;background:var(--white);border-radius:inherit}
.opt .lbl{font-size:13.5px;letter-spacing:.02em;color:var(--white-dim)}
.opt.sel .lbl{color:var(--white)}
textarea{width:100%;background:transparent;border:1px solid var(--hairline);color:var(--white);font-family:var(--sans);font-size:14px;letter-spacing:.02em;padding:13px 15px;outline:none;min-height:96px;resize:vertical}
textarea:focus{border-color:var(--white)}
.cta{margin:1vh auto 0}
.btn-solid{padding:16px 54px;background:var(--white);color:var(--black);font-size:12px;font-weight:500;letter-spacing:.36em;text-indent:.36em;text-transform:uppercase;transition:opacity .4s}
.btn-solid:hover{opacity:.88}
.btn-solid[disabled]{opacity:.5;cursor:wait}
.msg{min-height:20px;margin-top:22px;font-size:13px;color:var(--white-dim);letter-spacing:.03em}
.note{font-size:12px;color:var(--white-faint);letter-spacing:.04em;margin-bottom:4vh}
</style>
</head>
<body>
<div class="atmos" aria-hidden="true"><div class="glow"></div><div class="vignette"></div></div>
<main>
  <img class="wordmark" src="assets/wordmark-light.png" alt="Ascension">
  <div class="stage" id="stage">
    <p class="eyebrow" id="loading">One moment…</p>
  </div>
</main>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const params = new URLSearchParams(location.search);
const ID = params.get("id") || "";
const T = params.get("t") || "";
const PREVIEW = params.get("preview") === "1";
let FORM = null;
const ANSWERS = {};

async function api(action, extra) {
  const res = await fetch("/.netlify/functions/feedback", {
    method: "POST", headers: { "content-type": "application/json" },
    body: JSON.stringify({ id: ID, t: T, action, ...extra }),
  });
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(body.error || "Something went wrong.");
  return body;
}

function renderError(m) {
  $("stage").className = "stage fade";
  $("stage").innerHTML = `<h1>Feedback</h1><p class="lede">${esc(m)}</p>`;
}
function renderThanks() {
  $("stage").className = "stage fade";
  $("stage").innerHTML = `<p class="eyebrow">Received</p><h1>Thank You</h1>
    <p class="lede">Your feedback has been recorded — we're grateful you took the time. It genuinely shapes what we do next.</p>`;
}

function renderForm(d) {
  FORM = d.form || { questions: [] };
  const qs = (FORM.questions || []).map((q, i) => {
    if (q.type === "text") {
      return `<div class="q"><div class="qt">${esc(q.q)}</div>
        <textarea data-qid="${esc(q.id)}" placeholder="Your thoughts…"></textarea></div>`;
    }
    const multi = q.type === "multi";
    const opts = (q.options || []).map((o) =>
      `<div class="opt ${multi ? "multi" : ""}" data-qid="${esc(q.id)}" data-val="${esc(o)}" data-multi="${multi}">
         <span class="box"></span><span class="lbl">${esc(o)}</span></div>`).join("");
    return `<div class="q"><div class="qt">${esc(q.q)}</div>${opts}</div>`;
  }).join("");
  $("stage").className = "stage fade";
  $("stage").innerHTML = `
    <p class="eyebrow">Your feedback</p>
    <h1>${esc(d.event_name || "A Night With Ascension")}</h1>
    <p class="lede">${d.first_name ? "Thank you, " + esc(d.first_name) + "." : "Thank you for coming."} ${esc(FORM.intro || "")}</p>
    ${d.already_submitted ? '<p class="note">You\'ve already shared feedback — thank you. You can update your answers below.</p>' : ""}
    ${qs}
    <div class="cta"><button class="btn-solid" id="submit-btn">Submit</button></div>
    <p class="msg" id="msg"></p>`;
  $("submit-btn").addEventListener("click", doSubmit);
  $("stage").querySelectorAll(".opt").forEach((el) => el.addEventListener("click", () => toggleOpt(el)));
}

function toggleOpt(el) {
  const qid = el.dataset.qid, val = el.dataset.val, multi = el.dataset.multi === "true";
  if (multi) {
    const set = new Set(ANSWERS[qid] || []);
    if (set.has(val)) { set.delete(val); el.classList.remove("sel"); }
    else { set.add(val); el.classList.add("sel"); }
    ANSWERS[qid] = [...set];
  } else {
    ANSWERS[qid] = val;
    $("stage").querySelectorAll(`.opt[data-qid="${CSS.escape(qid)}"]`).forEach((o) => o.classList.toggle("sel", o === el));
  }
}

async function doSubmit() {
  if (PREVIEW) { $("msg").textContent = "This is a preview — answers aren't saved."; return; }
  const btn = $("submit-btn"); btn.disabled = true; $("msg").textContent = "Sending…";
  // gather textareas
  $("stage").querySelectorAll("textarea[data-qid]").forEach((t) => {
    if (t.value.trim()) ANSWERS[t.dataset.qid] = t.value.trim(); else delete ANSWERS[t.dataset.qid];
  });
  try {
    await api("submit", { answers: ANSWERS });
    renderThanks();
  } catch (err) { $("msg").textContent = err.message; btn.disabled = false; }
}

(async () => {
  if (PREVIEW) {
    try { renderForm(await api("preview")); } catch (err) { renderError(err.message); }
    return;
  }
  if (!ID || !T) { renderError("This link is missing information."); return; }
  try {
    const d = await api("view");
    renderForm(d);
  } catch (err) { renderError(err.message); }
})();
</script>
</body>
</html>
